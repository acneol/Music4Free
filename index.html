        const { useState, useRef, useEffect } = React;

        // IndexedDB Helper Functions with Self-Healing Store Verification & Quota Safety
        const DB_NAME = 'Music4FreeDB';
        const DB_VERSION = 5;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('blobs')) {
                        db.createObjectStore('blobs');
                    }
                    if (!db.objectStoreNames.contains('state')) {
                        db.createObjectStore('state');
                    }
                };

                request.onsuccess = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains('blobs') || !db.objectStoreNames.contains('state')) {
                        db.close();
                        const deleteReq = indexedDB.deleteDatabase(DB_NAME);
                        deleteReq.onsuccess = () => {
                            const retryReq = indexedDB.open(DB_NAME, DB_VERSION + 1);
                            retryReq.onerror = () => reject(retryReq.error);
                            
                            retryReq.onupgradeneeded = (e) => {
                                const newDb = e.target.result;
                                if (!newDb.objectStoreNames.contains('blobs')) newDb.createObjectStore('blobs');
                                if (!newDb.objectStoreNames.contains('state')) newDb.createObjectStore('state');
                            };
                            
                            retryReq.onsuccess = (e) => resolve(e.target.result);
                        };
                        deleteReq.onerror = () => reject(new Error("Failed to reset IndexedDB"));
                    } else {
                        resolve(db);
                    }
                };
            });
        }

        async function saveStateToDB(playlists, settings) {
            try {
                const db = await openDB();
                const tx = db.transaction('state', 'readwrite');
                const lightPlaylists = playlists.map(p => ({
                    ...p,
                    songs: p.songs.map(s => {
                        const { url, ...rest } = s;
                        return rest;
                    })
                }));
                tx.objectStore('state').put(lightPlaylists, 'playlists');
                tx.objectStore('state').put(settings, 'settings');
            } catch (e) {
                console.error("Error saving state to IndexedDB:", e);
            }
        }

        async function saveBlobToDB(fileKey, blob) {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('blobs', 'readwrite');
                    const store = tx.objectStore('blobs');
                    const req = store.put(blob, fileKey);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => {
                        if (req.error && req.error.name === 'QuotaExceededError') {
                            reject(new Error("StorageQuotaExceeded"));
                        } else {
                            reject(req.error);
                        }
                    };
                });
            } catch (e) {
                throw e;
            }
        }

        async function loadStateFromDB() {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(['blobs', 'state'], 'readonly');
                    const stateStore = tx.objectStore('state');
                    const blobStore = tx.objectStore('blobs');
                    
                    const playlistsReq = stateStore.get('playlists');
                    const settingsReq = stateStore.get('settings');

                    let lightPlaylists = null;
                    let settings = null;
                    let completedCount = 0;

                    const checkDone = async () => {
                        completedCount++;
                        if (completedCount === 2) {
                            try {
                                if (!lightPlaylists) {
                                    resolve({ playlists: null, settings: null });
                                    return;
                                }

                                const restoredPlaylists = [];

                                for (const playlist of lightPlaylists) {
                                    const restoredSongs = [];
                                    for (const song of playlist.songs) {
                                        const fileKey = song.fileKey || song.id;
                                        const blob = await new Promise((res) => {
                                            const req = blobStore.get(fileKey);
                                            req.onsuccess = () => res(req.result);
                                            req.onerror = () => res(null);
                                        });

                                        let url = "";
                                        if (blob) {
                                            try {
                                                url = URL.createObjectURL(blob);
                                            } catch (err) {
                                                console.error("Failed to create object URL for blob:", err);
                                            }
                                        }

                                        restoredSongs.push({
                                            ...song,
                                            fileKey,
                                            url
                                        });
                                    }
                                    restoredPlaylists.push({
                                        ...playlist,
                                        songs: restoredSongs
                                    });
                                }
                                resolve({ playlists: restoredPlaylists, settings: settings || {} });
                            } catch (err) {
                                reject(err);
                            }
                        }
                    };

                    playlistsReq.onsuccess = () => {
                        lightPlaylists = playlistsReq.result;
                        checkDone();
                    };
                    playlistsReq.onerror = () => reject(playlistsReq.error);

                    settingsReq.onsuccess = () => {
                        settings = settingsReq.result;
                        checkDone();
                    };
                    settingsReq.onerror = () => {
                        settings = {};
                        checkDone();
                    };
                });
            } catch (e) {
                console.error("Error loading state from IndexedDB:", e);
                return { playlists: null, settings: null };
            }
        }

        // Helper to format seconds to mm:ss
        const formatTime = (secs) => {
            if (isNaN(secs) || secs === 0) return "0:00";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        };

        // iTunes API Lookup for Smart Album Artwork Fallback
        async function fetchAlbumArtFromAPI(artist, title) {
            try {
                const query = `${artist} ${title}`.trim();
                if (!query || query.toLowerCase().includes("unknown")) return null;
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
                    return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
                }
            } catch (err) {
                console.log("iTunes API lookup failed:", err);
            }
            return null;
        }

        );

        const DEFAULT_PLAYLISTS = [
            { id: 'recently-added', name: 'Recently Added', isSystem: true, songs: [] },
            { id: 'all-songs', name: 'All Songs', isSystem: true, songs: [] }
        ];

        function Music4FreeApp() {
            const [playlists, setPlaylists] = useState(DEFAULT_PLAYLISTS);
            const [isLoaded, setIsLoaded] = useState(false);
            const [activePlaylistId, setActivePlaylistId] = useState('recently-added');
            const [currentSong, setCurrentSong] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [shuffle, setShuffle] = useState(false);
            const [repeatMode, setRepeatMode] = useState('none');
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);

            // Screensaver & Wake Lock states
            const [isScreensaverActive, setIsScreensaverActive] = useState(false);
            const wakeLockRef = useRef(null);
            const inactivityTimerRef = useRef(null);

            // Playlist editing state & pending song deletions
            const [isEditingPlaylist, setIsEditingPlaylist] = useState(false);
            const [editedPlaylistName, setEditedPlaylistName] = useState('');
            const [pendingDeletedSongIds, setPendingDeletedSongIds] = useState([]);
            const [showSongDeleteConfirm, setShowSongDeleteConfirm] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(null);

            const [draggedSongIndex, setDraggedSongIndex] = useState(null);
            const [dragOverSongIndex, setDragOverSongIndex] = useState(null);

            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [fullView, setFullView] = useState(false);
            const [deleteModal, setDeleteModal] = useState(null);
            const [helpModalOpen, setHelpModalOpen] = useState(false);
            const [newPlaylistName, setNewPlaylistName] = useState('');
            const [showNewPlaylistInput, setShowNewPlaylistInput] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const audioRef = useRef(null);
            const activePlaylist = playlists.find(p => p.id === activePlaylistId) || playlists[0];

            // Request Screen Wake Lock when music is playing to prevent phone from turning off
            useEffect(() => {
                const requestWakeLock = async () => {
                    if ('wakeLock' in navigator && isPlaying) {
                        try {
                            wakeLockRef.current = await navigator.wakeLock.request('screen');
                        } catch (err) {
                            console.error("Wake Lock error:", err);
                        }
                    }
                };

                if (isPlaying) {
                    requestWakeLock();
                } else {
                    if (wakeLockRef.current) {
                        wakeLockRef.current.release().catch(() => {});
                        wakeLockRef.current = null;
                    }
                }

                const handleVisibilityChange = async () => {
                    if (document.visibilityState === 'visible' && isPlaying && 'wakeLock' in navigator) {
                        try {
                            wakeLockRef.current = await navigator.wakeLock.request('screen');
                        } catch (err) {
                            console.error("Wake Lock re-acquire error:", err);
                        }
                    }
                };

                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLockRef.current) {
                        wakeLockRef.current.release().catch(() => {});
                    }
                };
            }, [isPlaying]);

            // Inactivity timer to automatically launch the screensaver mode
            useEffect(() => {
                const resetInactivityTimer = () => {
                    if (isScreensaverActive) setIsScreensaverActive(false);
                    if (inactivityTimerRef.current) clearTimeout(inactivityTimerRef.current);
                    
                    if (isPlaying) {
                        inactivityTimerRef.current = setTimeout(() => {
                            setIsScreensaverActive(true);
                        }, 60000); // Triggers screensaver after 1 minute of inactivity
                    }
                };

                const events = ['mousemove', 'mousedown', 'touchstart', 'keydown', 'scroll'];
                events.forEach(event => window.addEventListener(event, resetInactivityTimer));
                resetInactivityTimer();

                return () => {
                    events.forEach(event => window.removeEventListener(event, resetInactivityTimer));
                    if (inactivityTimerRef.current) clearTimeout(inactivityTimerRef.current);
                };
            }, [isPlaying, isScreensaverActive]);

            // Request permanent storage persistence & check quota on mount
            useEffect(() => {
                if (navigator.storage && navigator.storage.persist) {
                    navigator.storage.persist().then(granted => {
                        if (granted) {
                            console.log("Storage persistence successfully granted.");
                        } else {
                            console.log("Storage persistence was not granted.");
                        }
                    });
                }

                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(estimate => {
                        const usedMB = Math.round(estimate.usage / (1024 * 1024));
                        const quotaMB = Math.round(estimate.quota / (1024 * 1024));
                        const percent = ((estimate.usage / estimate.quota) * 100).toFixed(1);
                        console.log(`Storage: ${usedMB}MB / ${quotaMB}MB (${percent}%)`);
                        if (percent > 85) {
                            showToast(`Warning: Storage is at ${percent}%. Consider exporting a backup ZIP.`);
                        }
                    });
                }
            }, []);

            // Reset edit mode when changing active playlist
            useEffect(() => {
                setIsEditingPlaylist(false);
                setPendingDeletedSongIds([]);
            }, [activePlaylistId]);

            // Load saved state and settings from IndexedDB on mount
            useEffect(() => {
                loadStateFromDB().then(({ playlists: savedPlaylists, settings: savedSettings }) => {
                    let finalPlaylists = savedPlaylists;
                    if (!finalPlaylists || finalPlaylists.length === 0) {
                        finalPlaylists = DEFAULT_PLAYLISTS;
                    } else {
                        if (!finalPlaylists.some(p => p.id === 'recently-added')) {
                            finalPlaylists.unshift({ id: 'recently-added', name: 'Recently Added', isSystem: true, songs: [] });
                        }
                        if (!finalPlaylists.some(p => p.id === 'all-songs')) {
                            const raIdx = finalPlaylists.findIndex(p => p.id === 'recently-added');
                            finalPlaylists.splice(raIdx + 1, 0, { id: 'all-songs', name: 'All Songs', isSystem: true, songs: [] });
                        }
                    }
                    setPlaylists(finalPlaylists);

                    if (savedSettings) {
                        if (savedSettings.activePlaylistId) setActivePlaylistId(savedSettings.activePlaylistId);
                        if (savedSettings.shuffle !== undefined) setShuffle(savedSettings.shuffle);
                        if (savedSettings.repeatMode) setRepeatMode(savedSettings.repeatMode);
                        
                        if (savedSettings.currentSongId) {
                            let foundSong = null;
                            for (const pl of finalPlaylists) {
                                const match = pl.songs.find(s => s.id === savedSettings.currentSongId);
                                if (match) {
                                    foundSong = match;
                                    break;
                                }
                            }
                            if (foundSong) {
                                setCurrentSong(foundSong);
                            }
                        }
                    }
                    setIsLoaded(true);
                });
            }, []);

            // Auto-save state and settings to IndexedDB whenever they change
            useEffect(() => {
                if (isLoaded) {
                    const settings = {
                        activePlaylistId,
                        shuffle,
                        repeatMode,
                        currentSongId: currentSong?.id || null,
                        currentTime: 0
                    };
                    saveStateToDB(playlists, settings);
                }
            }, [playlists, activePlaylistId, shuffle, repeatMode, currentSong, isLoaded]);

            // Reset currentTime to 0 whenever the active song changes
            useEffect(() => {
                setCurrentTime(0);
                if (audioRef.current) {
                    audioRef.current.currentTime = 0;
                }
            }, [currentSong?.id]);

            // Handle audio playback sync
            useEffect(() => {
                if (audioRef.current && currentSong) {
                    if (isPlaying) {
                        audioRef.current.play().catch(e => console.log("Playback error:", e));
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [currentSong, isPlaying]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const handleCopy = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("Copied to clipboard!");
                }).catch(() => {
                    showToast("Failed to copy");
                });
            };

            const handleSongEnded = () => {
                if (repeatMode === 'one') {
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.play();
                    }
                    return;
                }
                handleNextSong();
            };

            const handleNextSong = () => {
                const queue = activePlaylist.songs;
                if (queue.length === 0) return;

                if (shuffle) {
                    const randomIndex = Math.floor(Math.random() * queue.length);
                    setCurrentSong(queue[randomIndex]);
                    setIsPlaying(true);
                    return;
                }

                const currentIndex = queue.findIndex(s => s.id === currentSong?.id);
                let nextIndex = currentIndex + 1;
                if (nextIndex >= queue.length) {
                    if (repeatMode === 'none' && currentIndex === queue.length - 1) {
                        setIsPlaying(false);
                        return;
                    }
                    nextIndex = 0;
                }
                setCurrentSong(queue[nextIndex]);
                setIsPlaying(true);
            };

            const handlePrevSong = () => {
                const queue = activePlaylist.songs;
                if (queue.length === 0) return;

                const currentIndex = queue.findIndex(s => s.id === currentSong?.id);
                let prevIndex = currentIndex - 1;
                if (prevIndex < 0) {
                    prevIndex = queue.length - 1;
                }
                setCurrentSong(queue[prevIndex]);
                setIsPlaying(true);
            };

            // Chunked bulk upload handler to prevent memory overload & IDB race conditions
            const handleFileUpload = async (e, targetPlaylistId) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const batchSize = 5;
                let successCount = 0;

                for (let i = 0; i < files.length; i += batchSize) {
                    const chunk = files.slice(i, i + batchSize);
                    setUploadProgress(`Processing songs ${i + 1} to ${Math.min(i + batchSize, files.length)} of ${files.length}...`);

                    await Promise.all(chunk.map(async (file, indexInChunk) => {
                        const fileKey = `${Date.now()}-${i + indexInChunk}-${Math.random()}`;
                        try {
                            await saveBlobToDB(fileKey, file);
                        } catch (err) {
                            if (err.message === "StorageQuotaExceeded") {
                                alert("Storage Quota Exceeded! Your device storage is full. Please export a backup ZIP immediately.");
                            } else {
                                console.error("Blob save error:", err);
                            }
                            return;
                        }

                        const fileUrl = URL.createObjectURL(file);
                        const defaultName = file.name.replace(/\.[^/.]+$/, "");
                        const nameParts = defaultName.split("-");
                        const artist = nameParts.length > 1 ? nameParts[0].trim() : "Unknown Artist";
                        const title = nameParts.length > 1 ? nameParts.slice(1).join("-").trim() : nameParts[0].trim();

                        const newSongObj = {
                            id: fileKey,
                            fileKey,
                            title,
                            artist,
                            url: fileUrl,
                            cover: null,
                            fileName: file.name
                        };

                        if (window.jsmediatags) {
                            await new Promise((resolve) => {
                                window.jsmediatags.read(file, {
                                    onSuccess: async (tag) => {
                                        let coverFound = false;
                                        const picture = tag.tags.picture;
                                        if (picture) {
                                            let base64String = "";
                                            for (let j = 0; j < picture.data.length; j++) {
                                                base64String += String.fromCharCode(picture.data[j]);
                                            }
                                            newSongObj.cover = `data:${picture.format};base64,${window.btoa(base64String)}`;
                                            coverFound = true;
                                        }
                                        if (tag.tags.title) newSongObj.title = tag.tags.title;
                                        if (tag.tags.artist) newSongObj.artist = tag.tags.artist;

                                        if (!coverFound) {
                                            const apiCover = await fetchAlbumArtFromAPI(newSongObj.artist, newSongObj.title);
                                            if (apiCover) newSongObj.cover = apiCover;
                                        }
                                        resolve();
                                    },
                                    onError: async () => {
                                        const apiCover = await fetchAlbumArtFromAPI(newSongObj.artist, newSongObj.title);
                                        if (apiCover) newSongObj.cover = apiCover;
                                        resolve();
                                    }
                                });
                            });
                        }

                        addSongToLibraryAndPlaylists(targetPlaylistId, newSongObj);
                        successCount++;
                    }));
                }

                setUploadProgress(null);
                showToast(`Successfully added ${successCount} tracks!`);
                e.target.value = "";
            };

            const addSongToLibraryAndPlaylists = (targetPlaylistId, song) => {
                setPlaylists(prev => {
                    const allSongsPl = prev.find(p => p.id === 'all-songs');
                    const recentPl = prev.find(p => p.id === 'recently-added');

                    const songExistsInAll = allSongsPl && allSongsPl.songs.some(s => s.id === song.id);
                    const newAllSongs = allSongsPl ? (songExistsInAll ? allSongsPl.songs : [...allSongsPl.songs, song]) : [song];
                    
                    const newRecentSongs = [song, ...(recentPl ? recentPl.songs.filter(s => s.id !== song.id) : [])].slice(0, 10);

                    return prev.map(p => {
                        if (p.id === 'all-songs') {
                            return { ...p, songs: newAllSongs };
                        }
                        if (p.id === 'recently-added') {
                            return { ...p, songs: newRecentSongs };
                        }
                        if (p.id === targetPlaylistId) {
                            if (!p.songs.some(s => s.id === song.id)) {
                                return { ...p, songs: [...p.songs, song] };
                            }
                        }
                        return p;
                    });
                });
                setCurrentSong(prev => prev || song);
            };

            const handleCustomCoverUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !currentSong) return;

                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    const newCoverUrl = uploadEvent.target.result;
                    
                    setPlaylists(prev => prev.map(p => ({
                        ...p,
                        songs: p.songs.map(s => s.id === currentSong.id ? { ...s, cover: newCoverUrl } : s)
                    })));

                    setCurrentSong(prev => ({ ...prev, cover: newCoverUrl }));
                    showToast("Custom cover art applied!");
                };
                reader.readAsDataURL(file);
                e.target.value = "";
            };

            const handleCreatePlaylist = () => {
                if (!newPlaylistName.trim()) return;
                const newId = `playlist-${Date.now()}`;
                setPlaylists([...playlists, { id: newId, name: newPlaylistName.trim(), isSystem: false, songs: [] }]);
                setNewPlaylistName('');
                setShowNewPlaylistInput(false);
                setActivePlaylistId(newId);
                showToast("Playlist created!");
            };

            const confirmDeletePlaylist = (id) => {
                setPlaylists(prev => prev.filter(p => p.id !== id));
                if (activePlaylistId === id) {
                    setActivePlaylistId('recently-added');
                }
                setDeleteModal(null);
                showToast("Playlist deleted");
            };

            const handleDragReorder = (draggedIdx, targetIdx) => {
                if (draggedIdx === null || targetIdx === null || draggedIdx === targetIdx) return;
                if (activePlaylist.isSystem) return;

                setPlaylists(prev => prev.map(p => {
                    if (p.id === activePlaylistId) {
                        const updatedSongs = [...p.songs];
                        const [movedSong] = updatedSongs.splice(draggedIdx, 1);
                        updatedSongs.splice(targetIdx, 0, movedSong);
                        return { ...p, songs: updatedSongs };
                    }
                    return p;
                }));
            };

            const handleExportData = async () => {
                showToast("Generating ZIP backup...");
                try {
                    const zip = new JSZip();
                    const audioFolder = zip.folder("audio");
                    const exportedSongsMap = {};
                    const exportedPlaylists = [];

                    for (const playlist of playlists) {
                        const playlistSongs = [];
                        for (const song of playlist.songs) {
                            let fileName = song.fileName || `${song.artist} - ${song.title}.mp3`.replace(/[/\\?%*:|"<>]/g, '-');
                            if (!exportedSongsMap[song.id]) {
                                try {
                                    const response = await fetch(song.url);
                                    const blob = await response.blob();
                                    audioFolder.file(fileName, blob);
                                    exportedSongsMap[song.id] = fileName;
                                } catch (err) {
                                    console.error("Could not fetch song blob:", err);
                                }
                            }
                            playlistSongs.push({
                                id: song.id,
                                fileKey: song.fileKey,
                                title: song.title,
                                artist: song.artist,
                                cover: song.cover,
                                fileName: exportedSongsMap[song.id] || fileName
                            });
                        }
                        exportedPlaylists.push({
                            id: playlist.id,
                            name: playlist.name,
                            isSystem: playlist.isSystem,
                            songs: playlistSongs
                        });
                    }

                    const metadata = {
                        version: "3.3",
                        exportDate: new Date().toISOString(),
                        playlists: exportedPlaylists
                    };

                    zip.file("playlists.json", JSON.stringify(metadata, null, 2));

                    const content = await zip.generateAsync({ type: "blob" });
                    const url = URL.createObjectURL(content);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `music4free-backup-${new Date().toISOString().slice(0, 10)}.zip`;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast("ZIP backup exported successfully!");
                } catch (err) {
                    console.error(err);
                    showToast("Export failed.");
                }
            };

            const handleImportData = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                showToast("Restoring backup ZIP...");
                try {
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(file);

                    if (!zipContent.files["playlists.json"]) {
                        alert("Invalid backup ZIP: missing playlists.json");
                        return;
                    }

                    const jsonString = await zipContent.files["playlists.json"].async("string");
                    const parsed = JSON.parse(jsonString);

                    if (!parsed || !parsed.playlists || !Array.isArray(parsed.playlists)) {
                        alert("Invalid backup file format.");
                        return;
                    }

                    const reconstructedPlaylists = [];

                    for (const playlist of parsed.playlists) {
                        const reconstructedSongs = [];
                        for (const song of playlist.songs) {
                            let songUrl = "";
                            let fileKey = song.fileKey || song.id || `${Date.now()}-${Math.random()}`;
                            if (song.fileName && zipContent.files[`audio/${song.fileName}`]) {
                                const audioBlob = await zipContent.files[`audio/${song.fileName}`].async("blob");
                                songUrl = URL.createObjectURL(audioBlob);
                                await saveBlobToDB(fileKey, audioBlob);
                            }
                            reconstructedSongs.push({
                                id: song.id || fileKey,
                                fileKey,
                                title: song.title,
                                artist: song.artist,
                                cover: song.cover,
                                url: songUrl,
                                fileName: song.fileName
                            });
                        }
                        reconstructedPlaylists.push({
                            id: playlist.id,
                            name: playlist.name,
                            isSystem: playlist.isSystem,
                            songs: reconstructedSongs
                        });
                    }

                    if (!reconstructedPlaylists.some(p => p.id === 'recently-added')) {
                        reconstructedPlaylists.unshift({ id: 'recently-added', name: 'Recently Added', isSystem: true, songs: [] });
                    }
                    if (!reconstructedPlaylists.some(p => p.id === 'all-songs')) {
                        const raIdx = reconstructedPlaylists.findIndex(p => p.id === 'recently-added');
                        reconstructedPlaylists.splice(raIdx + 1, 0, { id: 'all-songs', name: 'All Songs', isSystem: true, songs: [] });
                    }

                    setPlaylists(reconstructedPlaylists);
                    setActivePlaylistId(reconstructedPlaylists[0]?.id || 'recently-added');
                    showToast("Library successfully restored!");
                } catch (err) {
                    console.error(err);
                    alert("Failed to parse backup ZIP file.");
                }
                e.target.value = "";
            };

            const cycleRepeatMode = () => {
                if (repeatMode === 'none') setRepeatMode('all');
                else if (repeatMode === 'all') setRepeatMode('one');
                else setRepeatMode('none');
            };

            return (
                <div className="flex justify-center items-center min-h-screen bg-[#050507] text-white p-0 sm:p-4">
                    <div className="w-full max-w-md h-screen sm:h-[880px] bg-gradient-to-b from-[#18122B] via-[#0d0c14] to-[#070709] sm:rounded-[40px] shadow-[0_0_50px_rgba(147,51,234,0.15)] flex flex-col relative overflow-hidden border border-white/10">
                        
                        {currentSong && (
                            <audio 
                                ref={audioRef} 
                                src={currentSong.url} 
                                onEnded={handleSongEnded} 
                                onLoadedMetadata={() => {
                                    if (audioRef.current) {
                                        setDuration(audioRef.current.duration);
                                        audioRef.current.currentTime = 0;
                                    }
                                }}
                                onTimeUpdate={() => {
                                    if (audioRef.current) {
                                        setCurrentTime(audioRef.current.currentTime);
                                        setDuration(audioRef.current.duration || 0);
                                    }
                                }}
                            />
                        )}

                        {/* SCREENSAVER OVERLAY */}
                        {isScreensaverActive && currentSong && (
                            <div 
                                onClick={() => setIsScreensaverActive(false)}
                                className="absolute inset-0 bg-black z-50 flex flex-col items-center justify-center p-8 select-none cursor-pointer animate-fadeIn"
                            >
                                <div className="absolute top-8 text-purple-400/60 text-sm font-mono tracking-widest">
                                    {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                </div>
                                <div className="w-64 h-64 rounded-[36px] overflow-hidden shadow-[0_0_80px_rgba(168,85,247,0.25)] border border-white/10 mb-8 relative animate-pulse flex items-center justify-center bg-[#181622]">
                                    {currentSong.cover ? (
                                        <img src={currentSong.cover} alt="" className="w-full h-full object-cover opacity-90" />
                                    ) : (
                                        <div className="text-purple-300/40"><IconSolKey size={80} /></div>
                                    )}
                                </div>
                                <div className="text-center space-y-2 max-w-xs">
                                    <h2 className="text-xl font-black text-white truncate">{currentSong.title}</h2>
                                    <p className="text-sm text-purple-300/60 truncate">{currentSong.artist}</p>
                                </div>
                                <div className="mt-10">
                                    <SoundWave isPlaying={isPlaying} />
                                </div>
                                <div className="absolute bottom-8 text-[11px] text-purple-400/40 tracking-wider">
                                    Tap anywhere to exit screensaver
                                </div>
                            </div>
                        )}

                        {/* TOAST / UPLOAD PROGRESS NOTIFICATION */}
                        {(toastMessage || uploadProgress) && (
                            <div className="absolute top-16 left-1/2 -translate-x-1/2 z-40 w-11/12 max-w-xs text-center">
                                <div className="bg-purple-600/95 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-2xl border border-purple-400/30 transition animate-bounce">
                                    {uploadProgress || toastMessage}
                                </div>
                            </div>
                        )}

                        {/* TOP HEADER */}
                        <header className="flex items-center justify-between px-6 py-4 bg-white/[0.02] backdrop-blur-2xl border-b border-white/[0.06] z-20">
                            <div className="flex items-center space-x-3">
                                <button onClick={() => setSidebarOpen(true)} className="p-2.5 rounded-2xl bg-white/[0.06] hover:bg-white/[0.12] text-purple-300 transition active:scale-95">
                                    <IconMenu size={20} />
                                </button>
                                <h1 className="text-xl font-black tracking-tight bg-gradient-to-r from-purple-400 via-pink-400 to-purple-300 bg-clip-text text-transparent">
                                    Music4Free
                                </h1>
                            </div>
                            <div className="w-9 h-9 rounded-2xl bg-purple-500/20 border border-purple-500/30 flex items-center justify-center text-purple-300 shadow-inner">
                                <IconMusic size={18} />
                            </div>
                        </header>

                        {/* MAIN CONTENT AREA */}
                        <main className="flex-1 overflow-y-auto px-6 py-6 pb-52 space-y-6">
                            
                            {/* Playlist Banner Header */}
                            <div className="bg-gradient-to-br from-purple-900/40 via-purple-950/20 to-transparent p-5 rounded-3xl border border-purple-500/20 backdrop-blur-xl relative overflow-hidden">
                                <div className="absolute -right-10 -bottom-10 w-32 h-32 bg-pink-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                <div className="flex items-center justify-between relative z-10">
                                    <div className="flex-1 min-w-0 pr-3">
                                        <span className="text-[10px] uppercase tracking-widest text-purple-400 font-bold">Active Playlist</span>
                                        {isEditingPlaylist ? (
                                            <div className="flex items-center space-x-2 mt-1">
                                                {!activePlaylist.isSystem ? (
                                                    <input 
                                                        type="text" 
                                                        value={editedPlaylistName} 
                                                        onChange={(e) => setEditedPlaylistName(e.target.value)}
                                                        className="bg-black/50 border border-purple-500/50 rounded-xl px-3 py-1.5 text-lg font-black text-white focus:outline-none focus:border-pink-500 w-full"
                                                        autoFocus
                                                    />
                                                ) : (
                                                    <h2 className="text-xl font-black text-white truncate">{activePlaylist.name}</h2>
                                                )}
                                                <button 
                                                    onClick={() => {
                                                        if (pendingDeletedSongIds.length > 0) {
                                                            setShowSongDeleteConfirm(true);
                                                        } else {
                                                            if (!activePlaylist.isSystem && editedPlaylistName.trim()) {
                                                                setPlaylists(playlists.map(p => p.id === activePlaylist.id ? { ...p, name: editedPlaylistName.trim() } : p));
                                                                showToast("Playlist renamed!");
                                                            }
                                                            setIsEditingPlaylist(false);
                                                        }
                                                    }}
                                                    className="bg-purple-600 hover:bg-purple-500 px-3.5 py-2.5 rounded-xl text-xs font-bold text-white transition flex-shrink-0 shadow-md"
                                                >
                                                    Save
                                                </button>
                                            </div>
                                        ) : (
                                            <h2 className="text-2xl font-black tracking-tight text-white mt-0.5 truncate">{activePlaylist.name}</h2>
                                        )}
                                        <p className="text-xs text-purple-300/60 mt-1">{activePlaylist.songs.length} tracks in queue</p>
                                    </div>
                                    
                                    <div className="flex items-center space-x-2 flex-shrink-0">
                                        {activePlaylist.id !== 'recently-added' && (
                                            <button 
                                                onClick={() => {
                                                    if (!isEditingPlaylist) {
                                                        setEditedPlaylistName(activePlaylist.name);
                                                        setPendingDeletedSongIds([]);
                                                        setIsEditingPlaylist(true);
                                                    } else {
                                                        setIsEditingPlaylist(false);
                                                        setPendingDeletedSongIds([]);
                                                    }
                                                }}
                                                className={`px-3.5 py-2.5 rounded-2xl text-xs font-bold transition border ${
                                                    isEditingPlaylist 
                                                        ? 'bg-pink-600 text-white border-pink-400' 
                                                        : 'bg-white/[0.06] hover:bg-white/[0.12] text-purple-200 border-white/10'
                                                }`}
                                            >
                                                {isEditingPlaylist ? 'Cancel' : 'Edit'}
                                            </button>
                                        )}

                                        <label className="flex items-center space-x-1.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 px-3.5 py-2.5 rounded-2xl text-xs font-bold shadow-lg shadow-purple-900/40 cursor-pointer transition transform active:scale-95 border border-white/10">
                                            <IconPlus size={16} />
                                            <span>Add</span>
                                            <input type="file" accept="audio/*,video/mp4" multiple className="hidden" onChange={(e) => handleFileUpload(e, activePlaylist.id)} />
                                        </label>
                                    </div>
                                </div>
                            </div>

                            {/* Delete Button for Custom Playlists */}
                            {!activePlaylist.isSystem && (
                                <div className="flex justify-end">
                                    <button onClick={() => setDeleteModal(activePlaylist.id)} className="flex items-center space-x-1.5 text-xs text-red-400 bg-red-950/30 hover:bg-red-900/40 border border-red-800/30 px-3.5 py-2 rounded-xl transition">
                                        <IconTrash size={14} />
                                        <span>Delete Playlist</span>
                                    </button>
                                </div>
                            )}

                            {/* Songs List */}
                            {activePlaylist.songs.length === 0 ? (
                                <div className="flex flex-col items-center justify-center h-60 text-center text-purple-300/40 space-y-4 bg-white/[0.01] border border-white/[0.04] rounded-3xl p-6">
                                    <div className="w-16 h-16 rounded-2xl bg-purple-950/40 border border-purple-800/30 flex items-center justify-center text-purple-400 shadow-inner">
                                        <IconMusic size={32} />
                                    </div>
                                    <div>
                                        <p className="text-sm font-semibold text-white">Your playlist is empty</p>
                                        <p className="text-xs text-purple-300/60 mt-1">Upload MP3 files to start listening instantly.</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {activePlaylist.songs.map((song, index) => {
                                        const isCurrent = currentSong?.id === song.id;
                                        const isReorderable = !activePlaylist.isSystem;
                                        const isBeingDragged = draggedSongIndex === index;
                                        const isTargeted = dragOverSongIndex === index && draggedSongIndex !== index;
                                        const isPendingDelete = pendingDeletedSongIds.includes(song.id);

                                        return (
                                            <div 
                                                key={song.id}
                                                draggable={isReorderable && !isPendingDelete}
                                                onDragStart={() => {
                                                    if (!isReorderable || isPendingDelete) return;
                                                    setDraggedSongIndex(index);
                                                }}
                                                onDragOver={(e) => {
                                                    if (!isReorderable) return;
                                                    e.preventDefault();
                                                    setDragOverSongIndex(index);
                                                }}
                                                onDragEnd={() => {
                                                    setDraggedSongIndex(null);
                                                    setDragOverSongIndex(null);
                                                }}
                                                onDrop={(e) => {
                                                    if (!isReorderable) return;
                                                    e.preventDefault();
                                                    handleDragReorder(draggedSongIndex, index);
                                                    setDraggedSongIndex(null);
                                                    setDragOverSongIndex(null);
                                                }}
                                                onClick={() => { 
                                                    if (!isPendingDelete) {
                                                        setCurrentSong(song); 
                                                        setIsPlaying(true); 
                                                    }
                                                }}
                                                className={`flex items-center justify-between p-3.5 rounded-2xl transition-all border ${
                                                    isPendingDelete ? 'opacity-40 bg-red-950/30 border-red-500/40 line-through' :
                                                    isBeingDragged ? 'opacity-50 border-purple-400/50 bg-purple-900/20' :
                                                    isTargeted ? 'border-pink-500 bg-pink-950/30 scale-[1.01]' :
                                                    isCurrent 
                                                        ? 'bg-purple-900/40 border-purple-500/50 shadow-[0_4px_20px_rgba(168,85,247,0.15)]' 
                                                        : 'bg-white/[0.02] hover:bg-white/[0.06] border-white/[0.06]'
                                                }`}
                                            >
                                                <div className="flex items-center space-x-3.5 min-w-0 flex-1">
                                                    {isReorderable && !isPendingDelete && (
                                                        <span className="text-purple-300/40 hover:text-purple-200 cursor-grab active:cursor-grabbing flex-shrink-0" title="Drag to reorder">
                                                            <IconGrip size={16} />
                                                        </span>
                                                    )}
                                                    <div className="relative w-12 h-12 rounded-xl overflow-hidden bg-[#181622] flex-shrink-0 border border-white/10 shadow-md flex items-center justify-center">
                                                        {song.cover ? (
                                                            <img src={song.cover} alt={song.title} className="w-full h-full object-cover" />
                                                        ) : (
                                                            <div className="text-purple-300/40">
                                                                <IconSolKey size={26} />
                                                            </div>
                                                        )}
                                                        {isCurrent && !isPendingDelete && (
                                                            <div className="absolute inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center">
                                                                <div className="w-2 h-2 rounded-full bg-pink-400 animate-ping"></div>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="min-w-0 flex-1">
                                                        <p className={`text-sm font-bold truncate ${isCurrent && !isPendingDelete ? 'text-pink-300' : 'text-white'}`}>
                                                            {song.title}

                                    </div>
                                    <h3 className="text-lg font-bold mb-1.5">Delete Playlist?</h3>
                                    <p className="text-xs text-purple-300/60 mb-6 leading-relaxed">Are you sure you want to delete this playlist? This action cannot be undone.</p>
                                    <div className="flex space-x-3">
                                        <button onClick={() => setDeleteModal(null)} className="flex-1 bg-white/[0.06] hover:bg-white/[0.12] text-xs py-3 rounded-2xl text-purple-300 font-bold transition">Cancel</button>
                                        <button onClick={() => confirmDeletePlaylist(deleteModal)} className="flex-1 bg-red-600 hover:bg-red-500 text-xs py-3 rounded-2xl font-bold transition text-white shadow-lg shadow-red-900/40">Delete</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SONG DELETE CONFIRMATION MODAL (ON SAVE) */}
                        {showSongDeleteConfirm && (
                            <div className="absolute inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-6 animate-fadeIn">
                                <div className="bg-[#121118] border border-white/10 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl flex flex-col max-h-[80vh]">
                                    <div className="w-14 h-14 bg-red-950/50 border border-red-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-400 shadow-inner flex-shrink-0">
                                        <IconAlert size={26} />
                                    </div>
                                    <h3 className="text-lg font-bold mb-1.5">Are you sure you want to delete?</h3>
                                    <p className="text-xs text-purple-300/60 mb-4 leading-relaxed">The following songs will be removed upon saving:</p>
                                    
                                    <div className="bg-black/40 border border-white/10 rounded-2xl p-3 mb-6 overflow-y-auto text-left max-h-40 space-y-1.5">
                                        {pendingDeletedSongIds.map((id, idx) => {
                                            const songObj = activePlaylist.songs.find(s => s.id === id);
                                            if (!songObj) return null;
                                            return (
                                                <div key={id} className="text-xs text-purple-200 truncate font-medium flex items-center space-x-2">
                                                    <span className="text-pink-400 font-bold">{idx + 1}.</span>
                                                    <span className="truncate">{songObj.title} - {songObj.artist}</span>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="flex space-x-3 flex-shrink-0">
                                        <button 
                                            onClick={() => {
                                                setShowSongDeleteConfirm(false);
                                                setPendingDeletedSongIds([]);
                                            }} 
                                            className="flex-1 bg-white/[0.06] hover:bg-white/[0.12] text-xs py-3 rounded-2xl text-purple-300 font-bold transition"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const deletedIds = pendingDeletedSongIds;
                                                const isCurrentDeleted = currentSong && deletedIds.includes(currentSong.id);

                                                let nextSongToPlay = null;
                                                let shouldPlay = false;

                                                if (isCurrentDeleted) {
                                                    const oldSongs = activePlaylist.songs;
                                                    const currentIndex = oldSongs.findIndex(s => s.id === currentSong.id);
                                                    if (currentIndex !== -1) {
                                                        for (let i = 1; i <= oldSongs.length; i++) {
                                                            const checkIndex = (currentIndex + i) % oldSongs.length;
                                                            const candidate = oldSongs[checkIndex];
                                                            if (candidate && !deletedIds.includes(candidate.id)) {
                                                                nextSongToPlay = candidate;
                                                                shouldPlay = true;
                                                                break;
                                                            }
                                                        }
                                                    }
                                                }

                                                if (activePlaylist.id === 'all-songs') {
                                                    setPlaylists(prev => prev.map(p => ({
                                                        ...p,
                                                        songs: p.songs.filter(s => !deletedIds.includes(s.id))
                                                    })));
                                                } else {
                                                    setPlaylists(prev => prev.map(p => {
                                                        if (p.id === activePlaylist.id) {
                                                            return { ...p, songs: p.songs.filter(s => !deletedIds.includes(s.id)) };
                                                        }
                                                        return p;
                                                    }));
                                                }

                                                if (editedPlaylistName.trim()) {
                                                    setPlaylists(prev => prev.map(p => p.id === activePlaylist.id ? { ...p, name: editedPlaylistName.trim() } : p));
                                                }

                                                if (isCurrentDeleted) {
                                                    if (shouldPlay && nextSongToPlay) {
                                                        setCurrentSong(nextSongToPlay);
                                                        setIsPlaying(true);
                                                    } else {
                                                        setCurrentSong(null);
                                                        setIsPlaying(false);
                                                    }
                                                }

                                                setShowSongDeleteConstant = false;
                                                setShowSongDeleteConfirm(false);
                                                setPendingDeletedSongIds([]);
                                                setIsEditingPlaylist(false);
                                                showToast("Changes saved successfully!");
                                            }} 
                                            className="flex-1 bg-red-600 hover:bg-red-500 text-xs py-3 rounded-2xl font-bold transition text-white shadow-lg shadow-red-900/40"
                                        >
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Music4FreeApp />);
    </script>
</body>
</html>
